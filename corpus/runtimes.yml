# Pinned runtimes. sha256 is filled in by the `pin` workflow (tools/pin.py).
# Replace rolling URLs by tagged ones when you have chosen a release.
squashfs:
  name: type2-runtime
  urls:
    x86_64: https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
    aarch64: https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-aarch64
  sha256: {x86_64: "156f4bdbde9c52d01814600013e0a273f0118dc2de98975f3c8c63427ec79074", aarch64: "b4ff0030242d0c3bb12ce40541828303cf167493f4793456f0436edd6255c39d"}
# type2-runtime with squashfuse built for zlib, zstd, xz, lzo and lz4 (see build-runtime.yml).
# Used for the xz/lz4/lzo variants and the -fullrt control; benchmark only.
squashfs_full:
  name: type2-runtime-full
  urls:
    x86_64: https://github.com/probonopd/AppImageTests/releases/download/runtime-full/runtime-full-x86_64
  sha256: {x86_64: "6c881190831e1452013c6ccc3c6b4b1cfbae4b4447d2800f7438f6cff94be57c"}
# DwarFS runtime. The "lite" uruntime does not bundle mkdwarfs (1.5 MiB smaller, and it does not
# have to unpack a 7.3 MiB helper on every launch); it is what pkgforge-dev ships (issue #1).
dwarfs:
  name: uruntime-lite
  urls:
    x86_64: https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-dwarfs-lite-x86_64
    aarch64: https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-dwarfs-lite-aarch64
  sha256: {x86_64: "b3c2916153e089d703cee5a7ebc540941d2f1d71baa90eb3092b15eef48345a8", aarch64: "c1641dfe465f4cb70ae545fbfb9de7a221aa6e9a0b1d7ea600b213a1f10738a0"}
# The full uruntime (bundles mkdwarfs); only used by the -fullrt control variant.
dwarfs_full:
  name: uruntime-full
  urls:
    x86_64: https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-dwarfs-x86_64
    aarch64: https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-dwarfs-aarch64
  sha256: {x86_64: "179cfd3c37ed7afe31b044f3ac9e422777ff0a6881ec2b55304bd30752d8717b", aarch64: "724f8b92fbfc1aada336fcaa5a4b0a37e6db6a631ad164a17328327cab328cb9"}
