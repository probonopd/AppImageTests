      env: {QT_QPA_PLATFORM: xcb, LIBGL_ALWAYS_SOFTWARE: "1"}
      ready: {type: window, timeout_s: 90}
      workset_seconds: 15

  # Smallest variant TDF offers ("basic": no help, no extra language packs).
  - name: libreoffice
    category: huge
    arch: x86_64
    reference: true
    url: https://appimages.libreitalia.org/LibreOffice-26.8.1.1.basic-x86_64.AppImage
    sha256: "bccf75d0bf9bff86ed62b3676c2514da902019b5ce701c006b2f9062a82068ff"
